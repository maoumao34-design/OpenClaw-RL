<svg width="680" height="1010" viewBox="0 0 680 1010" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Personal Agent 完整实验：Simulator、OpenClaw、Policy 交互与 RL 训练循环</title>
<desc>Qwen3-32B Simulator 依据人设扮演 Student/TA/Teacher，通过 OpenClaw（提供工具与会话记忆）与被训练的 Qwen3-4B Policy 模型对话。每轮对话 Policy 生成 K 个候选回复，由同一模型担任的 PRM 多评委投票选出最优候选，该候选一路送回 OpenClaw 成为真实回复，另一路携带打分计入训练样本；凑够 16 条样本后由 Megatron 反向传播更新 Policy 权重，权重同步回服务引擎形成闭环。作业文件 homework→homework1→homework2 依次在三角色间传递。Separate 按顺序训练三个独立模型，Joint 用共享模型三者同时训练并复用 Separate 产出的作业快照。收敛速度（连续 3 次满足对方偏好所需的对话轮数）是 Table 3 报告的核心指标。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#3d3d3a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="1010" fill="#ffffff"/>

<text x="340" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">Simulator 扮演三种角色</text>
<g><rect x="110" y="50" width="140" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="180" y="72" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#444441">Student</text></g>
<g><rect x="270" y="50" width="140" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="340" y="72" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#444441">TA</text></g>
<g><rect x="430" y="50" width="140" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="500" y="72" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#444441">Teacher</text></g>
<line x1="180" y1="94" x2="290" y2="140" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="94" x2="340" y2="140" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="500" y1="94" x2="390" y2="140" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="240" y="140" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340" y="158" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#444441">Simulator（Qwen3-32B）</text>
<text x="340" y="178" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">依据人设扮演对应角色</text>
</g>

<text x="340" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#444441">实时对话交互</text>
<line x1="340" y1="196" x2="340" y2="230" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="190" y="230" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="340" y="248" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">OpenClaw（Agent 运行环境）</text>
<text x="340" y="268" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">提供工具调用 + 维护对话历史</text>
</g>
<line x1="340" y1="286" x2="340" y2="330" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="190" y="330" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="340" y="348" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#3C3489">Policy 模型（Qwen3-4B）</text>
<text x="340" y="368" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#534AB7">在 OpenClaw 里执行任务、生成回复</text>
</g>

<text x="340" y="412" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#444441">RL 训练循环：每轮对话同时产出训练样本</text>
<line x1="340" y1="386" x2="340" y2="430" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="190" y="430" width="300" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="340" y="452" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#3C3489">生成 K 个候选，PRM 投票选出最优</text>
<text x="340" y="474" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#534AB7">评委同样是 Policy 自己（M 票）</text>
</g>
<line x1="260" y1="490" x2="185" y2="530" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="420" y1="490" x2="480" y2="530" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="70" y="530" width="230" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="185" y="548" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#3C3489">送回 OpenClaw</text>
<text x="185" y="568" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#534AB7">成为真实回复</text>
</g>
<path d="M70,558 L30,558 L30,168 L240,168" fill="none" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="38" y="350" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#444441">真实回复</text>
<g>
<rect x="370" y="530" width="220" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="480" y="548" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#3C3489">计入训练样本</text>
<text x="480" y="568" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#534AB7">携带 PRM 打分</text>
</g>
<line x1="480" y1="586" x2="400" y2="610" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="250" y="610" width="300" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="400" y="632" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#3C3489">凑够 16 条样本</text>
<text x="400" y="654" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#534AB7">Megatron 反向传播，更新权重</text>
</g>
<path d="M550,640 L610,640 L610,358 L490,358" fill="none" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="515" y="499" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#444441">同步新权重</text>

<text x="340" y="702" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#444441">作业文件在角色间传递</text>
<g><rect x="110" y="720" width="140" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="180" y="738" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#712B13">homework</text><text x="180" y="758" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#993C1D">Student 写解答</text></g>
<line x1="250" y1="748" x2="270" y2="748" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<g><rect x="270" y="720" width="140" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="340" y="738" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#712B13">homework1</text><text x="340" y="758" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#993C1D">TA 批改追加</text></g>
<line x1="410" y1="748" x2="430" y2="748" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<g><rect x="430" y="720" width="140" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="500" y="738" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#712B13">homework2</text><text x="500" y="758" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#993C1D">Teacher 点评追加</text></g>

<text x="340" y="812" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#444441">两种训练顺序</text>
<g>
<rect x="110" y="830" width="220" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="220" y="852" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#444441">Separate（顺序训练）</text>
<text x="220" y="874" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">各自独立模型，依次进行</text>
</g>
<g>
<rect x="350" y="830" width="220" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="460" y="852" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#444441">Joint（联合训练）</text>
<text x="460" y="874" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">共享模型，三者同时进行</text>
</g>

<text x="340" y="925" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#444441">Joint 直接复用 Separate 已产出的作业快照，三角色从一开始同时启动</text>
<text x="340" y="970" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#444441">收敛指标：连续 3 次对话满足对方偏好所需的轮数（Table 3 核心数字）</text>
</svg>
