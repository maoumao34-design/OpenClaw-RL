<text x="340" y="60" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#444441">Separate（顺序训练）</text>
<text x="340" y="82" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">各自独立模型，依次进行</text>
</g>
<g>
<rect x="470" y="38" width="220" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="580" y="60" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#444441">Joint（联合训练）</text>
<text x="580" y="82" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">共享模型，三者同时进行</text>
</g>

