<svg width="920" height="1310" viewBox="0 0 920 1310" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Personal Agent 完整实验：对话循环与训练循环分离，含 OPD+RL loss 细节</title>
<desc>Qwen3-32B Simulator 依据人设扮演 Student/TA/Teacher，通过 OpenClaw 与被训练的 Qwen3-4B Policy 模型对话。Policy 生成的单次 rollout 直接送回 OpenClaw 成为真实回复，构成左侧对话循环。针对这同一次真实回复，右侧训练循环触发两个独立的 M 票判官（同一个模型换身份当裁判）：Hint 判官判断有没有可吸取的教训、筛出被采纳去重后最多 K 个候选 hint，送去 PRM Teacher（Policy 权重的冻结参考副本）蒸馏得到 OPD loss；Eval 判官独立打分 eval_score，直接作为 RL 的 advantage 得到 GRPO loss。两个 loss 加权合并成一个 loss 做一次反向传播，更新后的权重同步回 Policy 供下一轮对话使用。</desc>
<defs>
