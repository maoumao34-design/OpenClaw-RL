<g><rect x="380" y="50" width="140" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="450" y="72" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#444441">TA</text></g>
<g><rect x="540" y="50" width="140" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="610" y="72" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#444441">Teacher</text></g>
